name: Site snapshot
on:
  push:
    paths: ['pipeline/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pydantic beautifulsoup4 feedparser
      - run: python pipeline/build.py
      - run: |
          python -c "import json,sqlite3; a=json.load(open('public/offers.json')); c=sqlite3.connect('public/offers.sqlite'); assert c.execute('select count(*) from offers').fetchone()[0]==len(a)"
      - uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public/
