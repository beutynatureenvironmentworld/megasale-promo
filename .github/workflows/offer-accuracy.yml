name: Offer accuracy regression
on:
  workflow_dispatch:
  push:
    paths: ['pipeline/offer_quality_test.py','.github/workflows/offer-accuracy.yml']
permissions:
  contents: read
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 selectolax lxml extruct pydantic
      - run: python pipeline/offer_quality_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offer-quality-report
          path: public/offer-quality-fixture.json
