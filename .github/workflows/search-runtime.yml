name: Self hosted search integration
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/search-runtime.yml']
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p /tmp/searxng-config
          printf 'use_default_settings: true\nserver:\n  secret_key: "%s"\n  limiter: false\nsearch:\n  formats: [html, json]\n' "$(openssl rand -hex 32)" > /tmp/searxng-config/settings.yml
          docker run -d --name megasale-searxng -p 127.0.0.1:8888:8080 -v /tmp/searxng-config:/etc/searxng searxng/searxng:latest
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8888/ >/dev/null && exit 0; sleep 3; done
          docker logs megasale-searxng
          exit 1
      - run: pip install httpx beautifulsoup4 selectolax extruct feedparser pydantic rapidfuzz rank-bm25 diskcache tenacity
      - run: python pipeline/search_discovery.py
        env:
          SEARXNG_URL: http://127.0.0.1:8888
      - run: python pipeline/live_discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-search-evidence
          path: public/
