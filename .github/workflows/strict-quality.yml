name: Strict quality regression
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/strict-quality.yml','pipeline/strict_quality_gate.py']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pydantic beautifulsoup4 selectolax lxml extruct
      - run: python pipeline/offer_quality_test.py
      - run: python pipeline/strict_quality_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-quality-regression
          path: public/
