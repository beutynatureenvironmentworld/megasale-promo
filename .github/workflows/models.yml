name: Model inference tests
on:
  push:
    paths: ['.github/workflows/models.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {name: bge, model: BAAI/bge-small-en-v1.5, mode: embed}
          - {name: e5, model: intfloat/e5-base-v2, mode: embed}
          - {name: cross-encoder, model: cross-encoder/ms-marco-MiniLM-L-6-v2, mode: rank}
          - {name: qwen, model: Qwen/Qwen2.5-1.5B-Instruct, mode: generate}
          - {name: deepseek, model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B, mode: generate}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          MODEL: ${{ matrix.model }}
          MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          mkdir evidence
          df -h > evidence/resources.txt
          free -m >> evidence/resources.txt
          (
          pip install torch --index-url https://download.pytorch.org/whl/cpu &&
          pip install sentence-transformers transformers accelerate &&
          pip freeze &&
          /usr/bin/time -v python - <<'PY'
          import os
          model, mode = os.environ['MODEL'], os.environ['MODE']
          if mode == 'embed':
              from sentence_transformers import SentenceTransformer
              m=SentenceTransformer(model, device='cpu', trust_remote_code=False)
              x=m.encode(['query: seasonal sale','passage: merchant sale'])
              assert x.shape[0]==2
              print(x.shape, x[0][:8])
          elif mode == 'rank':
              from sentence_transformers import CrossEncoder
              m=CrossEncoder(model, device='cpu', trust_remote_code=False)
              print(m.predict([('sale','seasonal sale'),('sale','weather')]))
          else:
              from transformers import AutoTokenizer, AutoModelForCausalLM
              t=AutoTokenizer.from_pretrained(model, trust_remote_code=False)
              m=AutoModelForCausalLM.from_pretrained(model, trust_remote_code=False, low_cpu_mem_usage=True)
              x=t('Extract the expiry date from this synthetic fixture: Sale ends 2027-01-01.',return_tensors='pt')
              y=m.generate(**x,max_new_tokens=24,do_sample=False)
              assert y.shape[1]>x['input_ids'].shape[1]
              print(t.decode(y[0],skip_special_tokens=True))
          PY
          ) 2>&1 | tee evidence/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.name }}
          path: evidence/
